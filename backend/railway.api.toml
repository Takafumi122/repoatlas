# Railway configuration for RepoAtlas API service
# Root Directory in Railway Service Settings: /backend
# Config File Path in Railway Service Settings: /backend/railway.api.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/api"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Single replica required because per-IP rate limiting is stored in-memory
numReplicas = 1
